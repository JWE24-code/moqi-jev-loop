# Purpose notes for the dsh-jev-loop code map.
#
# exdraw lifts each function's one-line `why` from its JSDoc, so this file adds
# only what the doc comments cannot: how the seams fit together, and which
# nodes are load-bearing. The map merges it over the generated map:
#
#   exdraw map packages/dsh-jev-loop/src --focus apply --depth 2 \
#     --annotations docs/whiteboards/dsh-jev-loop-core.annotations.yaml \
#     --out docs/whiteboards/dsh-jev-loop-core

meta:
  title: "dsh-jev-loop — core architecture"
  subtitle: "One Cordis adapter over pure judgments, an injected keyring, and a Judger port."

functions:
  index.ts#apply:
    roleNote: Builds the Keyring and JevLoop, provides `jevLoop`, and turns four harness events into loop calls.
  index.ts#credentialStore:
    roleNote: The only place `ctx.credentials` is touched; the keyring sees a plain port.
  index.ts#pluginMessage:
    roleNote: The one channel the loop can speak on — a plugin-sourced user message.
  loop.ts#JevLoop.preStep:
    roleNote: Once per turn; a failed judgment still consumes the turn's one attempt.
  loop.ts#JevLoop.preTool:
    roleNote: Enforces the mode (log/ask/deny) and the skip list, and returns plain data.
  loop.ts#JevLoop.postTool:
    roleNote: Only runs for a result the harness did not already mark as an error.
  loop.ts#JevLoop.turnStopping:
    roleNote: Applies the per-turn nudge budget before it steers.
  keyring.ts#Keyring.refreshStored:
    roleNote: Lets a credential-store key outrank an env fallback that resolved before the store mounted.
  keyring.ts#Keyring.set:
    roleNote: Stores, probes once, then adopts the key; a failing probe still saves but reports.
  jev.ts#JevClient.systemOne:
    roleNote: The Judger port's production adapter — cache, cap, retry, fail-open.
  gates.ts#decidePreExecute:
    roleNote: Log observes without enforcing; ask and deny act on the same flags.
